name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in src/*.js scripts/*.mjs server.mjs; do
            node --check "$file"
          done
      - name: Run game and audio tests
        run: npm test
      - name: Build public game
        run: npm run build
      - name: Upload game for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Check whether Pages is enabled
        id: pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' > "$RUNNER_TEMP/pages-source" 2> "$RUNNER_TEMP/pages-error"; then
            if [[ "$(cat "$RUNNER_TEMP/pages-source")" == "workflow" ]]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
            else
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Choose GitHub Actions in Settings > Pages, then rerun this workflow."
            fi
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/pages-error"; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages is not enabled yet. Choose GitHub Actions in Settings > Pages, then rerun this workflow."
          else
            cat "$RUNNER_TEMP/pages-error" >&2
            exit 1
          fi

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
